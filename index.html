<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Üretim Akademisi — Sınava Hazırlık</title><style>
:root{font-family:Inter,'Segoe UI',system-ui,sans-serif;color:#e9effb;background:#0b1020;font-size:15px}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}.layout{display:grid;grid-template-columns:270px 1fr;min-height:100vh}aside{background:#11192b;border-right:1px solid #26334b;padding:26px 16px;position:sticky;top:0;height:100vh;overflow:auto}.logo{font-size:23px;font-weight:850;padding:0 12px 8px;letter-spacing:-.8px}.logo span{color:#8dbbff}.sub{color:#8da0bb;font-size:12px;padding:0 12px 22px}.nav{display:block;width:100%;border:0;text-align:left;padding:13px 15px;margin:4px 0;background:transparent;color:#b7c7df;border-radius:12px}.nav.active,.nav:hover{background:#243855;color:white}.nav .tag{float:right;font-size:11px;color:#8ea7c8}.divider{height:1px;background:#29354a;margin:20px 10px}.muted{color:#97a8c2}.tiny{font-size:12px}.main{padding:36px clamp(20px,5vw,80px);max-width:1350px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.pill{border:1px solid #364864;border-radius:100px;padding:7px 13px;color:#b9cee8;font-size:12px}.eyebrow{color:#8ebeff;text-transform:uppercase;letter-spacing:2px;font-size:12px;font-weight:700}h1{font-size:clamp(29px,3.6vw,45px);letter-spacing:-1.5px;margin:9px 0 10px}h2{font-size:22px;margin:0 0 15px;letter-spacing:-.5px}h3{margin:0 0 9px;font-size:17px}p{line-height:1.75}.lead{max-width:720px;color:#aebdd2;font-size:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{background:#151f33;border:1px solid #2a3a54;border-radius:19px;padding:24px}.card:hover{border-color:#3b5477}.card .icon{font-size:29px;margin-bottom:15px}.card p{color:#aabbd0;font-size:13px}.btn{border:1px solid #385070;border-radius:11px;padding:11px 17px;background:#223654;color:#f4f8ff;font-weight:650}.btn:hover{background:#2d4669}.btn.primary{background:#76aaff;color:#071428;border-color:#76aaff}.btn.primary:hover{background:#98c1ff}.btn.ghost{background:transparent}.btn.sm{padding:7px 12px;font-size:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:19px}.topic{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#151f33;border:1px solid #293b57;border-radius:13px;color:#ecf3ff;padding:15px;margin:9px 0}.topic:hover{border-color:#80b3ff}.number{display:grid;place-items:center;width:34px;height:34px;background:#253a57;border-radius:9px;color:#a5c9fa;flex-shrink:0}.topic .name{flex:1}.topic small{display:block;color:#91a6c2;margin-top:5px}.bar{height:8px;background:#263750;border-radius:20px;overflow:hidden}.bar>div{height:100%;background:#85b4ff;transition:width .2s}.callout{background:#1a2b43;border-left:3px solid #8dbaff;padding:18px 20px;border-radius:9px;margin:20px 0;line-height:1.8}.section{margin-top:27px}.note{padding:15px 18px;border:1px solid #293951;border-radius:12px;margin:10px 0;color:#c1cee1;font-size:13px;line-height:1.75}.note strong{color:#9ac3ff}.question{font-size:18px;font-weight:650;line-height:1.6}.option{display:block;width:100%;padding:14px 17px;margin:9px 0;border:1px solid #33445f;border-radius:12px;background:#19263c;color:#dce8fa;text-align:left}.option:hover:not(:disabled){background:#253d5b}.option.correct{border-color:#4bbd99;background:#153c37}.option.wrong{border-color:#f48d88;background:#4a292e}.feedback{padding:15px 18px;border-radius:11px;background:#23334b;margin-top:14px;line-height:1.65}.flash{height:235px;width:100%;display:grid;place-items:center;text-align:center;background:linear-gradient(130deg,#233b5e,#17253c);border:1px solid #49678f;border-radius:19px;padding:25px;font-size:21px;line-height:1.5;color:white}.flash small{display:block;color:#a3bddc;font-size:12px;margin-bottom:15px}.input{background:#0e1829;color:#fff;border:1px solid #3b4c65;padding:13px;border-radius:10px;width:100%}textarea{min-height:110px;resize:vertical}.stat{font-size:31px;font-weight:800;color:#b0d0ff}.crumb{color:#93a6c0;font-size:13px;margin-bottom:18px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:23px 0}.tabs button{border:1px solid #354762;background:#18253b;color:#b9c9df;padding:10px 14px;border-radius:11px}.tabs button.active{background:#7eaff9;color:#091629;border-color:#7eaff9;font-weight:750}.foot{margin:35px 0;color:#8499b5;font-size:12px}.formula{font-family:Cambria,Georgia,serif;font-size:18px;color:#c2dcff;padding:11px 0}.original{white-space:pre-wrap;line-height:1.8;color:#c6d4e8}.check{color:#69d4a9}.hide{display:none}@media(max-width:780px){.layout{display:block}aside{height:auto;position:relative;border-right:0;border-bottom:1px solid #283a54;padding:15px}.logo{font-size:20px}.sub{padding-bottom:5px}aside .divider{margin:8px}.nav{display:inline-block;width:auto;margin:3px;padding:9px;font-size:12px}.nav .tag{display:none}.main{padding:25px 16px}.grid{grid-template-columns:1fr}.top{display:block}.card{padding:18px}}
</style></head><body><div class="layout"><aside><div class="logo">Üretim <span>Akademisi</span></div><div class="sub">MM 3007 · Kişisel çalışma alanın</div><button class="nav" data-route="home">⌂ &nbsp; Genel bakış</button><div class="divider"></div><div class="sub" style="padding-bottom:4px">VİZE · DÖKÜM + KAYNAK</div><button class="nav" data-route="module:0">◈ &nbsp; Döküm</button><button class="nav" data-route="module:1">⚡ &nbsp; Kaynak</button><div class="divider"></div><div class="sub" style="padding-bottom:4px">FİNAL · PLASTİK + TALAŞLI</div><button class="nav" data-route="module:2">▱ &nbsp; Plastik Şekil Verme</button><button class="nav" data-route="module:3">⚙ &nbsp; Talaşlı İmalat</button><div class="divider"></div><button class="nav" data-route="problems">∑ &nbsp; İşlemli soru arşivi</button><button class="nav" data-route="review">↻ &nbsp; Tekrar & ilerleme</button><div class="divider"></div><div class="sub">Kaynak: yalnızca gönderdiğin ders ve çalışma dokümanları.<br>İlerlemen bu tarayıcıda saklanır.</div></aside><main class="main" id="app"></main></div><script src="content.js"></script><script>
const DATA=window.STUDY;const $=s=>document.querySelector(s);let route='home',tab='learn',qi=0,flipped=false,fi=0,ans=null,variantMode=false;let state;try{state=JSON.parse(localStorage.getItem('ua-v2'))||{done:{},wrong:{},quiz:{}}}catch(e){state={done:{},wrong:{},quiz:{}}}const save=()=>localStorage.setItem('ua-v2',JSON.stringify(state));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const mod=i=>DATA.modules[i];const tpc=(i,j)=>mod(i).topics[j];const pct=i=>Math.round(100*mod(i).topics.filter(t=>state.done[t.id]).length/mod(i).topics.length);const page=(s)=>{$('#app').innerHTML=s;document.querySelectorAll('[data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===route));window.scrollTo(0,0)};const go=r=>{route=r;tab='learn';qi=0;fi=0;flipped=false;ans=null;render()};document.addEventListener('click',e=>{let b=e.target.closest('[data-route]');if(b)go(b.dataset.route)});
function home(){let completed=Object.keys(state.done).filter(k=>state.done[k]).length;page(`<div class="top"><div><div class="eyebrow">Sınava hazırlanmanın daha iyi yolu</div><h1>Öğren. Hatırla. Uygula.</h1><p class="lead">Slayt slayt okumak yerine, her başlık için kısa konu özeti, bilgi kartları, sözel alıştırmalar ve mini quiz. Hesaplama soruları ayrı ve isteğe bağlı.</p></div><span class="pill">Çevrimdışı çalışır</span></div><div class="grid">${DATA.modules.map((m,i)=>`<div class="card"><div class="icon">${['◈','⚡','▱','⚙'][i]}</div><div class="eyebrow">${m.exam}</div><h2>${esc(m.name)}</h2><p>${m.topics.length} öğrenme başlığı · Konu bazlı quiz ve bilgi kartları</p><div class="bar"><div style="width:${pct(i)}%"></div></div><p>${pct(i)}% tamamlandı</p><button class="btn primary" data-route="module:${i}">Konulara gir →</button></div>`).join('')}</div><div class="section card"><h2>Çalışma düzeni</h2><p class="muted">1. Kısa özeti oku → 2. Bilgi kartlarını çevir → 3. Konuya özel soruları çöz → 4. İstersen açık uçlu yanıt yaz → 5. Konuyu tamamla.</p><div class="actions"><button class="btn" data-route="problems">İşlemli sorulara göz at</button><button class="btn" data-route="review">İlerlemem (${completed}/35)</button></div></div><div class="foot">Not: Platformda soru sayısı sınavdaki soru sayısıyla sınırlandırılmadı. Vize ve final kapsamı ayrı tutuldu.</div>`)}
function moduleView(i){let m=mod(i);page(`<div class="crumb"><a href="#" onclick="event.preventDefault();go('home')">Genel bakış</a> / ${m.exam}</div><div class="eyebrow">${m.exam} · ${m.topics.length} konu</div><h1>${esc(m.name)}</h1><p class="lead">Her başlığı bağımsız çalışabilirsin. Konuyu açtığında özet, kaynak notları, bilgi kartları, mini quiz ve açık uçlu pratik hazır.</p><div class="bar" style="margin:24px 0"><div style="width:${pct(i)}%"></div></div>${m.topics.map((t,j)=>`<button class="topic" data-route="topic:${i}:${j}"><span class="number">${state.done[t.id]?'✓':String(j+1).padStart(2,'0')}</span><span class="name"><strong>${esc(t.title)}</strong><small>${t.pages.length} ilgili slayt · Bilgi kartları + mini quiz</small></span><span class="muted">→</span></button>`).join('')}`)}
function topicView(i,j){let t=tpc(i,j),m=mod(i),total=t.quiz.length;let section=tab==='learn'?`<div class="callout"><strong>Bu konudan aklında kalması gereken:</strong><div>${esc(t.summary)}</div></div><div class="section"><h2>Ders notundan kısa kesitler</h2><p class="muted tiny">Bu bölüm yalnızca yüklediğin slaytlardan seçilmiş metinlerdir; tüm sayfalar gösterilmez.</p>${t.sourceNotes.map(n=>`<div class="note"><strong>Slayt ${n.page}</strong><div>${esc(n.text)}</div></div>`).join('')}</div><div class="actions"><button class="btn primary" onclick="tab='cards';render()">Bilgi kartlarına geç →</button></div>`:tab==='cards'?`<div class="eyebrow">Kart ${fi+1} / ${t.cards.length}</div><button class="flash" onclick="flipped=!flipped;render()"><div><small>${flipped?'ARKA YÜZ · CEVAP':'ÖN YÜZ · KARTI ÇEVİRMEK İÇİN TIKLA'}</small>${esc(flipped?t.cards[fi].back:t.cards[fi].front)}</div></button><div class="actions"><button class="btn" onclick="fi=(fi-1+t.cards.length)%t.cards.length;flipped=false;render()">← Önceki</button><button class="btn" onclick="fi=(fi+1)%t.cards.length;flipped=false;render()">Sonraki →</button><button class="btn primary" onclick="tab='quiz';qi=0;ans=null;render()">Mini quiz →</button></div>`:tab==='quiz'?quizView(t):`<div class="card"><h2>Açık uçlu pratik</h2><p class="question">${esc(t.open)}</p><textarea class="input" id="openanswer" placeholder="Cevabını buraya yaz... (otomatik puanlanmaz)"></textarea><div class="actions"><button class="btn" onclick="$('#openanswer').value='';">Temizle</button><button class="btn primary" onclick="$('#modelAnswer').classList.toggle('hide')">Kontrol noktalarını göster</button></div><div class="note hide" id="modelAnswer">${esc(t.summary)}<br><br>Karşılaştırmanı, yukarıdaki ders notu kesitlerindeki terimlerle kontrol et. Açık uçlu cevap otomatik doğru/yanlış puanlanmaz.</div></div>`;page(`<div class="crumb"><a href="#" onclick="event.preventDefault();go('module:${i}')">${esc(m.name)}</a> / Konu ${j+1}</div><div class="eyebrow">${m.exam} · Konu ${j+1}/${m.topics.length}</div><h1>${esc(t.title)}</h1><p class="lead">${esc(t.summary)}</p><div class="tabs">${[['learn','Konu özeti'],['cards','Bilgi kartları'],['quiz','Mini quiz'],['open','Açık uçlu']].map(([id,label])=>`<button class="${tab===id?'active':''}" onclick="tab='${id}';ans=null;render()">${label}</button>`).join('')}</div>${section}<div class="section actions"><button class="btn ${state.done[t.id]?'':'primary'}" onclick="state.done['${t.id}']=!state.done['${t.id}'];save();render()">${state.done[t.id]?'✓ Tamamlandı (geri al)':'✓ Konuyu tamamladım'}</button>${j+1<m.topics.length?`<button class="btn" onclick="go('topic:${i}:${j+1}')">Sonraki konu →</button>`:''}</div><div class="foot">Kaynak slaytlar: ${t.pages.join(', ')} · ${esc(m.name)}</div>`)}
function quizView(t){if(qi>=t.quiz.length)return `<div class="card"><h2>Mini quiz bitti 🎯</h2><p>Bu konuya ait soruları tamamladın. Dilersen yeniden çözebilir veya başka bir bölüme geçebilirsin.</p><button class="btn primary" onclick="qi=0;ans=null;render()">Yeniden çöz</button></div>`;let q=t.quiz[qi];return `<div class="card"><div class="eyebrow">Soru ${qi+1} / ${t.quiz.length}</div><p class="question">${esc(q.q)}</p>${q.options.map((o,k)=>`<button class="option ${ans===null?'':k===q.answer?'correct':k===ans?'wrong':''}" ${ans!==null?'disabled':''} onclick="choose(${k})">${String.fromCharCode(65+k)}. ${esc(o)}</button>`).join('')}${ans!==null?`<div class="feedback">${ans===q.answer?'✓ Doğru!':'Tekrar gözden geçir.'} ${esc(q.why)}</div><div class="actions"><button class="btn primary" onclick="qi++;ans=null;render()">${qi+1===t.quiz.length?'Sonucu bitir':'Sonraki soru →'}</button></div>`:''}</div>`}
function choose(k){let [_,i,j]=route.split(':');let t=tpc(+i,+j),q=t.quiz[qi];ans=k;if(k!==q.answer)state.wrong[t.id]=(state.wrong[t.id]||0)+1;state.quiz[t.id]=(state.quiz[t.id]||0)+1;save();render()}
function problems(){let list=variantMode?DATA.variants:DATA.problems;page(`<div class="eyebrow">İsteğe bağlı · Vize hesaplama pratiği</div><h1>İşlemli soru arşivi</h1><p class="lead">Henüz çalışmadıysan burayı geçebilirsin. Hocanın paylaştığı orijinal sorular ile <strong>aynı formüller ve aynı işlem adımları</strong> kullanılarak hazırlanmış sayısal varyasyonlar ayrı sekmelerde.</p><div class="tabs"><button class="${!variantMode?'active':''}" onclick="variantMode=false;render()">Hocanın orijinal soruları (${DATA.problems.length})</button><button class="${variantMode?'active':''}" onclick="variantMode=true;render()">Sayısal varyasyonlar (${DATA.variants.length})</button></div>${list.map((p,k)=>`<div class="card" style="margin-bottom:14px"><div class="eyebrow">${p.module===0?'DÖKÜM':'KAYNAK'} · ${variantMode?esc(p.source):esc(p.key)}</div><h3 style="margin-top:9px">${variantMode?esc(p.title):'Orijinal soru '+(k+1)}</h3><p class="original">${esc(variantMode?p.statement:p.text)}</p>${variantMode?`<button class="btn sm" onclick="document.getElementById('solution-${k}').classList.toggle('hide')">Formülleri ve çözümü göster / gizle</button><div class="note hide" id="solution-${k}"><strong>Kullanılan formüller</strong>${p.formula.map(f=>`<div class="formula">${esc(f)}</div>`).join('')}<strong>Çözüm</strong>${p.steps.map(s=>`<div>${esc(s)}</div>`).join('')}<p><strong>Kontrol sonucu:</strong> ${esc(p.unit)}</p></div>`:`<div class="muted tiny">Kaynak: ${p.module===0?'Döküm Çalışma Soruları PPTX, slayt':'Kaynak Çalışma Soruları PDF, sayfa'} ${p.page}. Bu metin hocanın dokümanından alınmıştır.</div>`}</div>`).join('')}<div class="foot">Sayısal varyasyonlar yalnızca doğrulanmış formül şablonları için oluşturuldu. Orijinal soruların hepsi otomatik varyasyona dönüştürülmedi.</div>`)}
function review(){let all=DATA.modules.flatMap(m=>m.topics),done=all.filter(t=>state.done[t.id]).length,wrong=Object.values(state.wrong).reduce((a,b)=>a+b,0);page(`<div class="eyebrow">Kişisel çalışma istatistikleri</div><h1>Tekrar ve ilerleme</h1><div class="grid"><div class="card"><div class="stat">${done} / ${all.length}</div><p>Tamamlanan konu</p></div><div class="card"><div class="stat">${wrong}</div><p>Yanlış işaretlenen cevap</p></div></div><div class="section"><h2>Tekrar önerileri</h2>${all.filter(t=>state.wrong[t.id]).sort((a,b)=>state.wrong[b.id]-state.wrong[a.id]).slice(0,12).map(t=>`<button class="topic" data-route="topic:${t.id.replace('-',':')}"><span class="number">↻</span><span class="name">${esc(t.title)}<small>${state.wrong[t.id]} yanlış cevap</small></span><span>→</span></button>`).join('')||'<div class="note">Henüz yanlış cevap yok. Konu mini quizlerini çözerek burada tekrar listesi oluşturabilirsin.</div>'}</div><div class="actions"><button class="btn ghost" onclick="if(confirm('Tüm yerel ilerleme silinsin mi?')){localStorage.removeItem('ua-v2');location.reload()}">İlerlemeyi sıfırla</button></div>`)}
function render(){let x=route.split(':');if(route==='home')home();else if(x[0]==='module')moduleView(+x[1]);else if(x[0]==='topic')topicView(+x[1],+x[2]);else if(route==='problems')problems();else review()}render();
</script></body></html>
